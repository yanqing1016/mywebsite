server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json text/xml;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip（data.js 较大，压缩收益明显）
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        image/svg+xml;

    # 无尾斜杠访问子路径时补斜杠（保证页面内相对资源落在正确目录下）
    location = /dsp          { return 301 /dsp/; }
    location = /satisfactory { return 301 /satisfactory/; }

    # 戴森球计划计算器
    location /dsp/ {
        try_files $uri $uri/ /dsp/index.html;
    }

    # 幸福工厂计算器
    location /satisfactory/ {
        try_files $uri $uri/ /satisfactory/index.html;
    }

    # 门户与其余静态文件
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
