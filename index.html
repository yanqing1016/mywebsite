<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>青岩 · 游戏产线计算器</title>
<link rel="stylesheet" href="styles.css?v=5.1" />
<script>document.documentElement.className += " js";</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <!-- 第一页：青岩（背景 + 粒子光效 + 大字） -->
  <section class="hero" id="top">
    <h1 class="brand">青岩</h1>
    <p class="tagline">GAME TOOLS</p>
    <a class="scroll-hint" href="#functions" aria-label="下滑查看功能">
      <span class="txt">下滑</span>
      <span class="chevs" aria-hidden="true"><span>&gt;</span><span>&gt;</span><span>&gt;</span></span>
    </a>
  </section>

  <!-- 第二页：功能选择（仅背景，无粒子） -->
  <section class="panel" id="functions">
    <div class="panel-inner">
      <p class="panel-title">功能导航 · FUNCTION</p>
      <nav class="entries">
        <a class="entry dsp" href="dsp/">
          <span class="ico">◉</span>
          <span class="txt">
            <span class="zh">戴森球计划 · 计算器</span>
            <span class="en">Dyson Sphere Program</span>
          </span>
        </a>
        <a class="entry sfy" href="satisfactory/">
          <span class="ico">⚙</span>
          <span class="txt">
            <span class="zh">幸福工厂 · 计算器</span>
            <span class="en">Satisfactory 1.0</span>
          </span>
        </a>
        <a class="entry music" href="music/">
          <span class="ico">♪</span>
          <span class="txt">
            <span class="zh">音乐解锁</span>
            <span class="en">Unlock Music · NCM / QMC / MFLAC</span>
          </span>
        </a>
      </nav>
    </div>
    <footer class="foot">
      <p>数据来源：BWIKI 戴森球计划公式合集 · SatisfactoryTools / satisfactory-calculator.com · UnlockMusic</p>
      <p class="ver">v5</p>
    </footer>
  </section>
</main>

<script src="particles.js?v=5.1"></script>
<script>
  /* 第二页内容入场动画：滚动到可视区时加 .visible（无 IO 环境直接显示） */
  (function () {
    var panel = document.getElementById("functions");
    if (!panel) return;
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            panel.classList.add("visible");
            io.disconnect();
          }
        }
      }, { threshold: 0.35 });
      io.observe(panel);
    } else {
      panel.classList.add("visible");
    }
  })();
</script>
</body>
</html>
