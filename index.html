<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>青岩 · 游戏产线计算器</title>
<link rel="stylesheet" href="styles.css?v=6.1" />
<script>document.documentElement.className += " js";</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <!-- 第一页：青岩（背景 + 粒子光效 + 大字） -->
  <section class="hero" id="top">
    <h1 class="brand">青岩</h1>
    <p class="tagline">GAME TOOLS</p>
    <a class="scroll-hint" href="#functions" aria-label="下滑查看功能">
      <span class="txt">下滑</span>
      <span class="chevs" aria-hidden="true"><span>&gt;</span><span>&gt;</span><span>&gt;</span></span>
    </a>
  </section>

  <!-- 第二页：功能选择（仅背景，无粒子） -->
  <section class="panel" id="functions">
    <div class="panel-inner">
      <p class="panel-title">功能导航 · FUNCTION</p>
      <nav class="entries">
        <a class="entry dsp" href="dsp/">
          <span class="ico">◉</span>
          <span class="txt">
            <span class="zh">戴森球计划 · 计算器</span>
            <span class="en">Dyson Sphere Program</span>
          </span>
        </a>
        <a class="entry sfy" href="satisfactory/">
          <span class="ico">⚙</span>
          <span class="txt">
            <span class="zh">幸福工厂 · 计算器</span>
            <span class="en">Satisfactory 1.0</span>
          </span>
        </a>
        <a class="entry music" href="music/">
          <span class="ico">♪</span>
          <span class="txt">
            <span class="zh">音乐解锁</span>
            <span class="en">Unlock Music · NCM / QMC / MFLAC</span>
          </span>
        </a>
      </nav>
      <section class="base-tool" aria-label="进制转换">
        <p class="base-title">进制转换 · BASE CONVERTER</p>
        <div class="base-grid">
          <label class="base-cell">
            <span class="base-name">二进制 <i>BIN</i></span>
            <input type="text" data-base="2" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0">
          </label>
          <label class="base-cell">
            <span class="base-name">八进制 <i>OCT</i></span>
            <input type="text" data-base="8" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0">
          </label>
          <label class="base-cell">
            <span class="base-name">十进制 <i>DEC</i></span>
            <input type="text" data-base="10" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0">
          </label>
          <label class="base-cell">
            <span class="base-name">十六进制 <i>HEX</i></span>
            <input type="text" data-base="16" autocomplete="off" spellcheck="false" placeholder="0">
          </label>
        </div>
      </section>
    </div>
    <footer class="foot">
      <p>数据来源：BWIKI 戴森球计划公式合集 · SatisfactoryTools / satisfactory-calculator.com · UnlockMusic</p>
      <p class="ver">v6</p>
    </footer>
  </section>
</main>

<script src="particles.js?v=6"></script>
<script>
  /* 第二页入场动画：进入视口加 .visible 触发交错上浮；离开时移除，
     使每次翻页都重放动画（无 IO 环境直接显示）。 */
  (function () {
    var panel = document.getElementById("functions");
    if (!panel) return;
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          panel.classList.toggle("visible", entries[i].isIntersecting);
        }
      }, { threshold: 0.35 });
      io.observe(panel);
    } else {
      panel.classList.add("visible");
    }
  })();

  /* 桌面端：把滚轮识别为整页翻页（而非自由滚动），消除吸附卡顿。
     阈值累积（兼容触控板小增量）+ 冷却锁（防惯性连翻）；
     触屏滚动不产生 wheel 事件，不受影响。 */
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var acc = 0, locked = false, decay = 0;
    var THRESHOLD = 60, LOCK_MS = 1100;

    function flip(dir) {
      locked = true;
      acc = 0;
      var target = dir > 0 ? document.getElementById("functions") : document.getElementById("top");
      if (target) target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      setTimeout(function () { locked = false; }, reduce ? 150 : LOCK_MS);
    }

    window.addEventListener("wheel", function (e) {
      var vh = window.innerHeight || 1;
      var onFirst = (window.scrollY || window.pageYOffset || 0) < vh / 2;
      var goingDown = e.deltaY > 0;
      var isFlipDir = (onFirst && goingDown) || (!onFirst && !goingDown);
      if (!isFlipDir) return;                 // 非翻页方向：放行给浏览器
      e.preventDefault();                     // 接管：不让原生滚动与吸附打架
      if (locked) return;
      acc += e.deltaY;
      clearTimeout(decay);
      decay = setTimeout(function () { acc = 0; }, 240);
      if (acc >= THRESHOLD) flip(1);
      else if (acc <= -THRESHOLD) flip(-1);
    }, { passive: false });
  })();

  /* 进制转换：任一格输入，实时换算其余三格（BigInt 保证大数精度）。
     非法字符：所在格子标红提示，不影响其他格子。 */
  (function () {
    var RULES = { 2: /^[01]+$/, 8: /^[0-7]+$/, 10: /^[0-9]+$/, 16: /^[0-9a-fA-F]+$/ };
    var PREFIX = { 2: "0b", 8: "0o", 10: "", 16: "0x" };
    var inputs = Array.prototype.slice.call(document.querySelectorAll(".base-grid input"));
    if (inputs.length !== 4) return;

    function cellOf(input) { return input.closest(".base-cell"); }

    inputs.forEach(function (input) {
      input.addEventListener("input", function () {
        var base = +input.dataset.base;
        var v = input.value.replace(/\s+/g, "");
        input.value = v;
        cellOf(input).classList.remove("invalid");

        if (v === "") {
          inputs.forEach(function (o) {
            if (o !== input) { o.value = ""; cellOf(o).classList.remove("invalid"); }
          });
          return;
        }
        if (!RULES[base].test(v)) { cellOf(input).classList.add("invalid"); return; }

        var big;
        try { big = BigInt(PREFIX[base] + v.toLowerCase()); }
        catch (err) { cellOf(input).classList.add("invalid"); return; }

        inputs.forEach(function (o) {
          var b = +o.dataset.base;
          if (b === base) return;
          o.value = big.toString(b).toUpperCase();
          cellOf(o).classList.remove("invalid");
        });
      });
    });
  })();
</script>
</body>
</html>
