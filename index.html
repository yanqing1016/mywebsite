<!-- 二级界面：进制转换（点击功能卡片进入） -->
<div class="base-overlay" id="baseOverlay" aria-hidden="true">
  <div class="base-panel">
    <div class="base-head">

    <div class="base-grid">
      <label class="base-cell">

      <label class="base-cell">

      </label>
      <label class="base-cell">
        <span class="base-name">十进制 <i>DEC</i></span>
        <input type="text" data-base="10" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="如 10.5">
      </label>
      <label class="base-cell">
        <span class="base-name">十六进制 <i>HEX</i></span>

    </div>
    <p class="base-tip">在任意格输入，其余三格实时换算（支持小数，如 10.5；BigInt 精确换算，大数不丢精度；无限小数以 … 截断提示）</p>
  </div>

<script src="particles.js?v=6"></script>
<script>
  /* 第二页入场动画：进入视口加 .visible 触发交错上浮；离开时移除，
     使每次翻页都重放动画（无 IO 环境直接显示）。 */
  (function () {
    var panel = document.getElementById("functions");
    if (!panel) return;
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          panel.classList.toggle("visible", entries[i].isIntersecting);
          /* 翻到功能页时给背景图层加模糊（CSS 过渡渐变） */
          document.body.classList.toggle("at-functions", entries[i].isIntersecting);
        }
      }, { threshold: 0.35 });
      io.observe(panel);
    } else {
      panel.classList.add("visible");
    }
  })();

  /* 桌面端：把滚轮识别为整页翻页（而非自由滚动），消除吸附卡顿。
     阈值累积（兼容触控板小增量）+ 冷却锁（防惯性连翻）；
     触屏滚动不产生 wheel 事件，不受影响；进制转换界面打开时滚轮被屏蔽。 */
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var acc = 0, locked = false, decay = 0;
    var THRESHOLD = 60, LOCK_MS = 1100;
    function anyOverlayOpen() {
      var a = document.getElementById("baseOverlay"), b = document.getElementById("learnOverlay");
      return (a && a.classList.contains("open")) || (b && b.classList.contains("open"));
    }

    function flip(dir) {
      locked = true;
      acc = 0;
      var target = dir > 0 ? document.getElementById("functions") : document.getElementById("top");
      if (target) target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      setTimeout(function () { locked = false; }, reduce ? 150 : LOCK_MS);
    }

    window.addEventListener("wheel", function (e) {
      if (anyOverlayOpen()) { e.preventDefault(); return; }
      var vh = window.innerHeight || 1;
      var onFirst = (window.scrollY || window.pageYOffset || 0) < vh / 2;
      var goingDown = e.deltaY > 0;
      var isFlipDir = (onFirst && goingDown) || (!onFirst && !goingDown);
      if (!isFlipDir) return;                 // 非翻页方向：放行给浏览器
      e.preventDefault();                     // 接管：不让原生滚动与吸附打架
      if (locked) return;
      acc += e.deltaY;
      clearTimeout(decay);
      decay = setTimeout(function () { acc = 0; }, 240);
      if (acc >= THRESHOLD) flip(1);
      else if (acc <= -THRESHOLD) flip(-1);
    }, { passive: false });
  })();

  /* 进入功能的过渡动画：点击功能卡片先整页淡出，280ms 后跳转；
     从浏览器缓存返回（bfcache）时移除淡出态，避免白屏。 */
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll("a.entry[href]"), function (link) {
      link.addEventListener("click", function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        var href = link.getAttribute("href");
        document.documentElement.classList.add("qy-exit");
        setTimeout(function () { location.href = href; }, 280);
      });
    });
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) document.documentElement.classList.remove("qy-exit");
    });
  })();

  /* 二级界面开关：卡片点击 / 返回按钮 / Esc / 点击遮罩 */
  (function () {
    var overlays = [
      { overlay: document.getElementById("baseOverlay"), openBtn: document.getElementById("openBase") },
      { overlay: document.getElementById("learnOverlay"), openBtn: document.getElementById("openStudy") }
    ];
    overlays.forEach(function (item) {
      if (!item.overlay || !item.openBtn) return;
      var back = item.overlay.querySelector(".base-back");
      function setOpen(open) {
        item.overlay.classList.toggle("open", open);
        item.overlay.setAttribute("aria-hidden", open ? "false" : "true");
        if (open) {
          var first = item.overlay.querySelector("input, a.study-link");
          if (first) setTimeout(function () { first.focus(); }, 420);
        }
      }
      item.openBtn.addEventListener("click", function () { setOpen(true); });
      if (back) back.addEventListener("click", function () { setOpen(false); });
      item.overlay.addEventListener("click", function (e) {
        if (e.target === item.overlay) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && item.overlay.classList.contains("open")) setOpen(false);
      });
    });
  })();

  /* 进制转换：任一格输入，实时换算其余三格。
     支持小数：内部用 BigInt 有理数（num/den）精确换算，
     目标进制能精确表示则完整输出；无限小数按位数上限截断并以 … 提示。 */
  (function () {
    var RULES = {
      2:  /^-?([01]+(\.[01]*)?|\.[01]+)$/,
      8:  /^-?([0-7]+(\.[0-7]*)?|\.[0-7]+)$/,
      10: /^-?([0-9]+(\.[0-9]*)?|\.[0-9]+)$/,
      16: /^-?([0-9a-fA-F]+(\.[0-9a-fA-F]*)?|\.[0-9a-fA-F]+)$/
    };
    var MAXFRAC = { 2: 24, 8: 10, 10: 14, 16: 6 };
    var inputs = Array.prototype.slice.call(document.querySelectorAll(".base-grid input"));
    if (inputs.length !== 4) return;

    function cellOf(input) { return input.closest(".base-cell"); }
    function bigGcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }

    /* 解析 base 进制字符串为分数 {num, den}（den > 0） */
    function parseInBase(str, base) {
      var neg = str.charAt(0) === "-";
      if (neg) str = str.slice(1);
      var parts = str.split(".");
      var ip = parts[0] || "0";
      var fp = parts[1] || "";
      var B = BigInt(base), num = 0n, den = 1n, i;
      for (i = 0; i < ip.length; i++) num = num * B + BigInt(parseInt(ip[i], base));
      for (i = 0; i < fp.length; i++) { num = num * B + BigInt(parseInt(fp[i], base)); den *= B; }
      if (neg) num = -num;
      return { num: num, den: den };
    }

    /* 该分数在目标进制下小数点后多少位可精确表示；无限循环小数返回 -1 */
    function exactFracDigits(den, base) {
      var d = den, B = BigInt(base), k = 0;
      while (d > 1n) {
        var g = bigGcd(d, B);
        if (g === 1n) return -1;
        var t = B, kk = 1;
        while (t < g) { t *= B; kk++; }
        k += kk;
        d = d / g;
      }
      return k;
    }

    function formatInBase(v, base) {
      var neg = v.num < 0n;
      var n = neg ? -v.num : v.num;
      var d = v.den;
      var out = (n / d).toString(base);
      var rem = n % d;
      if (rem !== 0n) {
        var need = exactFracDigits(d / bigGcd(rem, d), base);
        var limit = need >= 0 ? Math.min(need, 80) : MAXFRAC[base];
        var frac = "", r = rem, i;
        for (i = 0; i < limit; i++) {
          r *= BigInt(base);
          frac += (r / d).toString(base);
          r = r % d;
          if (r === 0n) break;
        }
        out += "." + frac;
        if (r !== 0n) out += "…";
      }
      return (neg ? "-" : "") + out.toUpperCase();
    }

    inputs.forEach(function (input) {
      input.addEventListener("input", function () {
        var base = +input.dataset.base;
        var v = input.value.replace(/\s+/g, "").replace(/,/g, ".");
        input.value = v;
        cellOf(input).classList.remove("invalid");

        if (v === "") {
          inputs.forEach(function (o) {
            if (o !== input) { o.value = ""; cellOf(o).classList.remove("invalid"); }
          });
          return;
        }
        if (!RULES[base].test(v) || !window.BigInt) { cellOf(input).classList.add("invalid"); return; }

        var val;
        try { val = parseInBase(v, base); }
        catch (err) { cellOf(input).classList.add("invalid"); return; }

        inputs.forEach(function (o) {
          var b = +o.dataset.base;
          if (b === base) return;
          o.value = formatInBase(val, b);
          cellOf(o).classList.remove("invalid");
        });
      });
    });
  })();
</script>
</body>
</html>
